
name: Initialize TFE Owner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Initialize database
        run: npm run db:init
        env:
          DATABASE_URL: ${{ secrets.TFE_DATABASE_URL }}

      - name: Create owner account
        run: npm run owner:create -- "$TFE_OWNER_EMAIL" "TheFellz" "$TFE_OWNER_PASSWORD"
        env:
          DATABASE_URL: ${{ secrets.TFE_DATABASE_URL }}
          TFE_OWNER_EMAIL: ${{ secrets.TFE_OWNER_EMAIL }}
          TFE_OWNER_PASSWORD: ${{ secrets.TFE_OWNER_PASSWORD }}
